<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="bg-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="shirt-grad-1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="skin-grad-1" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#f6d5b8"/>
      <stop offset="100%" stop-color="#eac09d"/>
    </linearGradient>
    <filter id="avatar-shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#bg-grad-1)" filter="url(#avatar-shadow)"/>
  <circle cx="100" cy="100" r="90" fill="#f8fafc" opacity="0.95"/>

  <!-- Body / Shoulders -->
  <path d="M40 185 C40 145, 70 135, 100 135 C130 135, 160 145, 160 185 Z" fill="url(#shirt-grad-1)"/>
  <!-- Inner T-Shirt / V-neck -->
  <path d="M85 135 L100 155 L115 135 Z" fill="#38bdf8"/>
  <!-- Jacket Collar -->
  <path d="M72 135 L88 165 L100 155 L82 135 Z" fill="#334155"/>
  <path d="M128 135 L112 165 L100 155 L118 135 Z" fill="#334155"/>

  <!-- Neck -->
  <rect x="88" y="112" width="24" height="28" rx="6" fill="url(#skin-grad-1)"/>

  <!-- Head -->
  <ellipse cx="100" cy="85" rx="34" ry="40" fill="url(#skin-grad-1)"/>

  <!-- Ears -->
  <ellipse cx="65" cy="86" rx="6" ry="10" fill="url(#skin-grad-1)"/>
  <ellipse cx="135" cy="86" rx="6" ry="10" fill="url(#skin-grad-1)"/>

  <!-- Hair Modern Quiff -->
  <path d="M66 78 C65 52, 85 40, 102 40 C120 40, 136 50, 134 76 C125 65, 115 62, 100 62 C85 62, 75 68, 66 78 Z" fill="#1e1b4b"/>
  <path d="M68 62 C78 45, 110 40, 128 48 C115 44, 90 46, 75 58 Z" fill="#312e81"/>

  <!-- Eyebrows -->
  <path d="M78 74 Q86 70 94 73" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M106 73 Q114 70 122 74" stroke="#1e1b4b" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- Eyes -->
  <circle cx="86" cy="83" r="4" fill="#1e293b"/>
  <circle cx="114" cy="83" r="4" fill="#1e293b"/>
  <circle cx="85" cy="81.5" r="1.5" fill="#ffffff"/>
  <circle cx="113" cy="81.5" r="1.5" fill="#ffffff"/>

  <!-- Nose -->
  <path d="M100 81 L98 92 L103 92" stroke="#d49a6a" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>

  <!-- Smile -->
  <path d="M90 102 Q100 110 110 102" stroke="#b91c1c" stroke-width="2.5" stroke-linecap="round" fill="none"/>

  <!-- Modern Glasses (Stylish Tech look) -->
  <rect x="74" y="75" width="22" height="16" rx="5" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  <rect x="104" y="75" width="22" height="16" rx="5" fill="none" stroke="#4f46e5" stroke-width="2.5"/>
  <path d="M96 82 L104 82" stroke="#4f46e5" stroke-width="2.5"/>
  <path d="M67 80 L74 81" stroke="#4f46e5" stroke-width="2"/>
  <path d="M126 81 L133 80" stroke="#4f46e5" stroke-width="2"/>

  <!-- Tech badge pill -->
  <rect x="62" y="166" width="76" height="20" rx="10" fill="#4f46e5"/>
  <text x="100" y="180" font-family="'Segoe UI', sans-serif" font-size="9" font-weight="700" fill="#ffffff" text-anchor="middle">SUMIT KUMAR</text>
</svg>
